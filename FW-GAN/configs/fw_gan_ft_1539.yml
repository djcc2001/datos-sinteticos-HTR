device: 'cuda'
model: 'adversarial_model'
dataset: 'custom'
seed: 123456
img_height: 32
char_width: 16
ckpt:

training:
  dset_split: 'train'
  split_file: './splits/authors/1539_ft_train.txt'
  epochs: 25
  lr_policy: 'linear'
  start_decay_epoch: 10
  n_epochs_decay: 15
  batch_size: 8
  eval_batch_size: 4
  sample_nrow: 4
  lr: 2.0e-5
  adam_b1: 0.5
  adam_b2: 0.999
  lambda_kl: 0.0002
  grad_clip_norm: 5.0
  torch_compile: false
  amp: true
  num_workers: 1
  prefetch_factor: 2
  r1_gamma: 1.0
  r1_every: 16
  fdl_num_proj: 128
  fdl_upscale_factor: 2
  fdl_chunk_size: 16
  fdl_every: 1
  lambda_fdl: 1.0
  sample_iter_val: 100
  print_iter_val: 20
  start_save_epoch_val: 1
  save_epoch_val: 1
  sample_dir: 'imgs'
  ckpt_dir: 'ckpts'
  lexicon: './data/spanish_words.txt'
  max_word_len: 24
  n_class: 95
  capitalize_ratio: 0.0
  sort_input: false
  num_critic_train: 1
  reset_epoch_on_load: true
  freeze_modules: ['R', 'W', 'S']
  use_hf_discriminator: true

valid:
  dset_name: 'custom'
  dset_split: 'val'
  split_file: './splits/authors/1539_ft_val.txt'
  batch_size: 4
  compute_style_metrics: true
  every: 1
  monitor_metric: 'word_acc'
  monitor_mode: 'max'
  early_stop:
    enabled: true
    patience: 6
  n_generate: ~
  dims: 2048
  mmd_degree: 3
  mmd_gamma: ~
  mmd_coef0: 1.
  mmd_subsets: 25
  mmd_subset_size: 128
  mmd_var: true

test:
  dset_split: 'test'
  split_file: './splits/authors/1539_eval_test.txt'
  interp_num: 7
  nrow: 4

GenModel:
  G_ch: 64
  style_dim: 128
  bottom_width: 4
  bottom_height: 4
  resolution: 32
  G_kernel_size: 3
  G_attn: '64'
  n_class: 95
  num_G_SVs: 1
  num_G_SV_itrs: 1
  G_shared: false
  shared_dim: 0
  no_hier: false
  cross_replica: false
  mybn: false
  BN_eps: 1.e-05
  SN_eps: 1.e-08
  init: 'N02'
  G_param: 'SN'
  norm_style: 'bn'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true
  first_layer: true
  one_hot_k: 1

DiscModel:
  D_ch: 64
  D_wide: true
  resolution: 32
  D_kernel_size: 3
  D_attn: '64'
  n_class: 95
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

HFDiscModel:
  D_ch: 64
  D_wide: true
  resolution: 32
  D_kernel_size: 3
  D_attn: '64'
  n_class: 95
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

OcrModel:
  resolution: 16
  in_channel: 1
  norm: 'bn'
  init: 'none'
  dropout: 0.
  n_class: 96
  rnn_depth: 0
  bidirectional: False

SharedBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  dropout: 0.0
  norm: 'bn'

EncModel:
  style_dim: 128
  init: 'none'

WidModel:
  n_writer: 1551
  init: 'none'
