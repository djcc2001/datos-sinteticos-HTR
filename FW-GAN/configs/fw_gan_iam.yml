device: 'cuda'
model: 'adversarial_model'
dataset: 'custom'
seed: 123456
img_height: 32
char_width: 16
# Entrenar desde cero; poner ruta solo para reanudar.
ckpt: runs/fw_gan_iam-03-15-12-12/ckpts/last.pth

training:
  # MANDATORY: explicit no-leakage split implemented in lib/datasets.py
  dset_split: 'train'
  # Entorno objetivo: 100 épocas
  epochs: 100
  lr_policy: 'linear'
  start_decay_epoch: 40
  n_epochs_decay: 60
  # batch_size objetivo: 32 (se ajusta automáticamente si hay OOM)
  batch_size: 16
  eval_batch_size: 8
  sample_nrow: 3
  # LR conservador para estabilidad (GAN + CTC)
  lr: 1.0e-4
  adam_b1: 0.5
  adam_b2: 0.999
  lambda_kl: 0.0002
  # Estabilidad extra
  grad_clip_norm: 5.0
  # Performance toggles (safe defaults)
  torch_compile: false
  amp: true
  num_workers: 4
  prefetch_factor: 2
  # R1 regularization on real images (hinge GAN stabilizer)
  r1_gamma: 2.0
  r1_every: 16
  # FDL (frequency-domain loss) knobs for low-VRAM GPUs
  fdl_num_proj: 256
  fdl_upscale_factor: 2
  fdl_chunk_size: 32
  fdl_every: 2
  lambda_fdl: 1.0
  sample_iter_val: 200
  print_iter_val: 20
  start_save_epoch_val: 50
  save_epoch_val: 1
  sample_dir: 'imgs'
  ckpt_dir: 'ckpts'
  lexicon: './data/spanish_words.txt'
  max_word_len: 24
  # Debe coincidir con la longitud de Alphabets['custom'] en lib/alphabet.py
  n_class: 98
  capitalize_ratio: 0.0
  sort_input: false
  # 1:1 updates D/G por estabilidad en este dataset
  num_critic_train: 1

valid:
  n_generate: ~
  dset_name: 'custom'
  dset_split: 'val'
  batch_size: 8
  dims: 2048
  mmd_degree: 3
  mmd_gamma: ~
  mmd_coef0: 1.
  mmd_subsets: 50
  mmd_subset_size: 1000
  mmd_var: true

test:
  interp_num: 7
  nrow: 4

GenModel:
  G_ch: 64
  style_dim: 128
  bottom_width: 4
  bottom_height: 4
  resolution: 32
  G_kernel_size: 3
  G_attn: '64'
  n_class: 98
  num_G_SVs: 1
  num_G_SV_itrs: 1
  G_shared: false
  shared_dim: 0
  no_hier: false
  cross_replica: false
  mybn: false
  BN_eps: 1.e-05
  SN_eps: 1.e-08
  init: 'N02'
  G_param: 'SN'
  norm_style: 'bn'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true
  first_layer: true
  one_hot_k: 1

DiscModel:
  D_ch: 64
  D_wide: true
  resolution: 32
  D_kernel_size: 3
  D_attn: '64'
  n_class: 98
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

HFDiscModel:
  D_ch: 64
  D_wide: true
  resolution: 32
  D_kernel_size: 3
  D_attn: '64'
  n_class: 98
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

OcrModel:
  resolution: 16
  in_channel: 1
  norm: 'bn'
  init: 'none'
  dropout: 0.
  # ctc config
  # CTC necesita (alfabeto + blank). blank = último índice.
  n_class: 99
  rnn_depth: 0
  bidirectional: False

SharedBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  dropout: 0.0
  norm: 'bn'

EncModel:
  style_dim: 128
  init: 'none'

WidModel:
  # Writer IDs van 0..1544 (incluye 1544 en test) => 1545 clases
  n_writer: 1545
  init: 'none'
